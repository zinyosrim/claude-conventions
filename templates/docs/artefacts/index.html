<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artefakte</title>
<style>
  :root {
    --bg: #fafafa; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --card: #fff; --accent: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --card: #18181b; --accent: #5eead4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 32px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  li a.title { color: var(--fg); font-weight: 600; text-decoration: none; }
  li a.title:hover { color: var(--accent); }
  li p { margin: 2px 0 0; color: var(--muted); font-size: .875rem; }
  .meta { font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .meta a { color: var(--accent); }
  .old li { opacity: .65; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Artefakte</h1>
    <p>Alles zum Ansehen im Browser. Regeln in <code>docs/README.md</code>.</p>
  </header>

  <h2>Aktuell</h2>

      <div class="meta">Spec: checkout · 2026-09-23 · <a href="https://claude.ai/code/artifact/…">Artifact</a></div>
    </li>
    -->
  </ul>

  <h2>Bestand</h2>
  <ul class="old">
    <!-- Überholte Stücke hierher verschieben, nicht löschen. -->
  </ul>
</main>
</body>
</html>
